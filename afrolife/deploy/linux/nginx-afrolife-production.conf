upstream afrolife_super_app_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name afrolife-agency.duckdns.org;

    client_max_body_size 11m;

    # Financial-service paths stay on the authenticated Super App API gateway.
    # It signs identity assertions and dispatches privately to Edir, Insurance,
    # and SACCO/MFI; never proxy these routes directly to backend ports.
    location ^~ /api/v1/edir {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location ^~ /api/v1/insurance {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location ^~ /api/v1/mfi {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location ^~ /api/v1/ {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location / {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }
}

# Install this snippet at /etc/nginx/snippets/afrolife-proxy-headers.conf.
# It is included from every proxy location so API and static requests preserve
# host/client/protocol context and can reuse the upstream connection.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
