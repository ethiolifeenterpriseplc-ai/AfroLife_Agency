upstream afrolife_super_app_gateway {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost afrolife-agency.duckdns.org;

    client_max_body_size 11m;

    location ^~ /api/v1/edir {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location ^~ /api/v1/insurance {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location ^~ /api/v1/mfi {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }

    location / {
        proxy_pass http://afrolife_super_app_gateway;
        include /etc/nginx/snippets/afrolife-proxy-headers.conf;
    }
}
